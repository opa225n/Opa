version: "3.8"

# Stack de base : PostgreSQL (données) + n8n (orchestration du flux WhatsApp/IA).
# Toutes les valeurs sensibles viennent de .env (copier .env.example vers .env et le remplir).
# Déploiement détaillé : docs/DEPLOIEMENT.md

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Le port n'est PAS publié vers l'extérieur : seuls les conteneurs du réseau interne
    # (n8n) peuvent atteindre la base, conformément au TRD section 8 (sécurité réseau).
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - interne

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_PORT: "5678"
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      # Secrets métier transmis aux workflows via les variables d'environnement n8n
      # (lues par les noeuds Code — jamais écrites en dur dans un flux exporté).
      META_APP_SECRET: ${META_APP_SECRET}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      META_WHATSAPP_TOKEN: ${META_WHATSAPP_TOKEN}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      AGENCE_ALERT_WHATSAPP: ${AGENCE_ALERT_WHATSAPP}
      RETENTION_JOURS: ${RETENTION_JOURS}
    ports:
      # En production, mettre un reverse proxy (Caddy/Nginx/Traefik) devant ce port
      # pour le HTTPS obligatoire (TRD section 8) — voir docs/DEPLOIEMENT.md.
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - interne

volumes:
  postgres_data:
  n8n_data:

networks:
  interne:
    driver: bridge
